<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Booking Status - PADDLE ZONE</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Replace with your actual Firebase project configuration
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function processBookingAction() {
      const statusTitle = document.getElementById('statusTitle');
      const statusText = document.getElementById('statusText');
      const iconContainer = document.getElementById('iconContainer');

      // Get parameters from URL (e.g. update-status.html?id=DOCUMENT_ID&action=accept)
      const urlParams = new URLSearchParams(window.location.search);
      const bookingId = urlParams.get('id');
      const action = urlParams.get('action');

      if (!bookingId || !action) {
        statusTitle.innerText = "Invalid Link";
        statusText.innerText = "Missing booking ID or action parameter in the URL.";
        iconContainer.innerHTML = `<span class="text-red-500 text-3xl font-bold">✕</span>`;
        return;
      }

      try {
        const bookingRef = doc(db, "bookings", bookingId);
        const bookingSnap = await getDoc(bookingRef);

        if (!bookingSnap.exists()) {
          statusTitle.innerText = "Not Found";
          statusText.innerText = "This booking record does not exist in the database.";
          iconContainer.innerHTML = `<span class="text-red-500 text-3xl font-bold">✕</span>`;
          return;
        }

        const bookingData = bookingSnap.data();

        // Prevent updating if already processed
        if (bookingData.status === "ACCEPTED" || bookingData.status === "REJECTED") {
          statusTitle.innerText = "Already Processed";
          statusText.innerText = `This booking was already set to ${bookingData.status}.`;
          iconContainer.innerHTML = `<span class="text-yellow-500 text-3xl font-bold">!</span>`;
          return;
        }

        // Determine new status based on email link action
        const isAccept = action.toLowerCase() === 'accept';
        const newStatus = isAccept ? 'ACCEPTED' : 'REJECTED';

        // 2. Update status field in Firebase Firestore
        await updateDoc(bookingRef, {
          status: newStatus,
          updatedAt: new Date().toISOString()
        });

        // 3. Display success response to Admin
        if (isAccept) {
          statusTitle.innerText = "Booking Approved!";
          statusText.innerText = `The court for ${bookingData.guestName} on ${bookingData.date} (${bookingData.timeSlot}) is now marked as BOOKED.`;
          iconContainer.innerHTML = `<span class="text-green-500 text-3xl font-bold">✓</span>`;
        } else {
          statusTitle.innerText = "Booking Rejected";
          statusText.innerText = `The booking request for ${bookingData.guestName} has been rejected and the slot is released.`;
          iconContainer.innerHTML = `<span class="text-orange-500 text-3xl font-bold">✕</span>`;
        }

      } catch (error) {
        console.error("Error updating status:", error);
        statusTitle.innerText = "Update Failed";
        statusText.innerText = "An error occurred while updating Firebase: " + error.message;
        iconContainer.innerHTML = `<span class="text-red-500 text-3xl font-bold">!</span>`;
      }
    }

    window.addEventListener('DOMContentLoaded', processBookingAction);
  </script>
</head>
<body class="bg-[#0b1b2d] text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#132e4d] via-[#0b1b2d] to-[#060e18]">

  <div class="bg-[#060e18]/80 border border-white/10 p-8 rounded-2xl max-w-md w-full text-center space-y-4 shadow-2xl backdrop-blur-md">
    <div id="iconContainer" class="w-16 h-16 bg-white/5 border border-white/10 rounded-full flex items-center justify-center mx-auto">
      <span class="text-slate-400 text-sm">...</span>
    </div>
    
    <h1 id="statusTitle" class="text-2xl font-black italic tracking-wide text-white">Processing Request...</h1>
    <p id="statusText" class="text-sm text-slate-300">Connecting to database to update booking status...</p>

    <div class="pt-4 border-t border-white/10">
      <a href="index.html" class="inline-block bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs uppercase tracking-wider py-3 px-6 rounded-xl transition">
        Return to Home Page
      </a>
    </div>
  </div>

</body>
</html>
